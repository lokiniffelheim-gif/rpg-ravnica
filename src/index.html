<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Los archivos de Ravnica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Metamorphous&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#ffffff;--bg2:#f8f3ea;--bg3:#f0e8d8;--bg-body:#f0e4cc;--gold:#8b1c1c;--gold-dark:#6a1010;--gold-text:#f5e8cc;--border:#c0945a;--border2:#a08050;--text:#1a0a04;--text2:#5a3820;--text3:#7a5030;--hover:#e8d8b8;--check-hover:#c0a878;--check-bg:#f5e8cc;--setup-bg:#ede0b8;--input-ph:#5a3820}
.rv.dark{--bg:#0e0d0b;--bg2:#1a1814;--bg3:#242018;--bg-body:#0a0908;--gold:#9b2020;--gold-dark:#7a1010;--gold-text:#e8dcc8;--border:#3a3028;--border2:#4a3a28;--text:#e8dcc8;--text2:#a09070;--text3:#9a8060;--hover:#2a2420;--check-hover:#2a2420;--check-bg:#242018;--setup-bg:#1a1814;--input-ph:#9a8060}
html,body{height:100%;background:var(--bg-body)}
.rv{font-family:'IM Fell English',Georgia,serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;display:flex;flex-direction:column;font-size:18px;transition:background .3s,color .3s}
.rv-head{font-family:'Metamorphous',serif;font-weight:400;letter-spacing:.05em}
.rv-row:hover{background:var(--hover)!important}
.rv-btn-gold{background:var(--gold);color:var(--gold-text);border:1px solid var(--gold-dark);cursor:pointer;font-family:'Metamorphous',serif;font-size:13px;letter-spacing:.08em;padding:5px 14px;border-radius:3px;transition:filter .15s}
.rv-btn-gold:hover{background:var(--gold-dark)}
.rv-editable{cursor:text;padding:4px 8px;border-radius:3px;border:1px solid transparent;transition:border-color .15s}
.rv-md-body>*:first-child{margin-top:0}.rv-md-body>*:last-child{margin-bottom:0}.rv-md-body p{margin:0 0 .6em}.rv-md-body ul,.rv-md-body ol{margin:.3em 0 .6em;padding-left:1.4em}.rv-md-body h1,.rv-md-body h2,.rv-md-body h3,.rv-md-body h4{margin:.7em 0 .3em}
.rv-editable:hover{border-color:var(--border2);background:var(--bg3)}
.rv-filter{font-size:12px;padding:2px 8px;border-radius:10px;cursor:pointer;font-family:'Metamorphous',serif;letter-spacing:.04em;border:1px solid transparent;transition:all .1s;background:transparent;font-weight:400;color:var(--text2)}
.rv-pill{display:inline-flex;align-items:center;gap:3px;font-size:12px;padding:2px 6px;border-radius:6px;font-family:'Metamorphous',serif;letter-spacing:.03em}
.rv-pill-x{background:none;border:none;cursor:pointer;color:inherit;font-size:13px;line-height:1;padding:0 0 0 2px;opacity:.6}
.rv-nav-hint{font-size:.7em;opacity:.5;margin-left:2px;vertical-align:middle}
@media(pointer:coarse){.rv-nav-hint{display:none}}
.rv-clickable{cursor:pointer;transition:filter .15s}
.rv-clickable:hover{filter:brightness(1.3)}
.rv-pill-x:hover{opacity:1;color:var(--gold)}
.rv-dropdown{position:absolute;top:calc(100% + 4px);left:0;right:0;background:var(--bg2);border:1px solid var(--border2);border-radius:4px;z-index:200;padding:4px;box-shadow:0 4px 16px rgba(0,0,0,.2)}
.rv-check-row{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:3px;cursor:pointer;font-size:16px;font-family:'IM Fell English',Georgia,serif;color:var(--text);transition:background .1s}
.rv-check-row:hover{background:var(--check-hover)}
.rv-check-row input[type=checkbox]{appearance:none;-webkit-appearance:none;width:14px;height:14px;border:1px solid var(--text2);border-radius:2px;background:var(--check-bg);cursor:pointer;flex-shrink:0;position:relative}
.rv-check-row input[type=checkbox]:checked{background:var(--gold);border-color:var(--gold)}
.rv-check-row input[type=checkbox]:checked::after{content:'✓';position:absolute;top:-1px;left:2px;font-size:13px;color:var(--gold-text)}
.rv-check-row input[type=checkbox]:disabled{opacity:.4;cursor:default}
.rv input,.rv textarea,.rv select{-webkit-appearance:none!important;appearance:none!important;background-color:var(--bg)!important;background:var(--bg)!important;color:var(--text)!important;-webkit-text-fill-color:var(--text)!important;border-radius:3px!important;opacity:1!important;font-family:'IM Fell English',Georgia,serif!important;font-size:17px!important;border-color:var(--border2)!important}
.rv input::placeholder,.rv textarea::placeholder{color:var(--input-ph)!important;-webkit-text-fill-color:var(--input-ph)!important;opacity:1!important}
.rv input[type=checkbox]{width:14px!important;height:14px!important;font-size:unset!important}
.setup-input{width:100%;padding:8px 12px;border-radius:4px;border:1px solid var(--border2);background:var(--setup-bg);color:var(--text);font-family:'IM Fell English',serif;font-size:16px;outline:none;margin-bottom:8px}
.setup-input:focus{border-color:var(--gold)}
::-webkit-scrollbar{width:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#a08050;border-radius:2px}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.rv-detail{animation:fadeUp .16s ease}
.syncing{animation:pulse 1.5s infinite}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:2px}
.rv-frame{display:block;border:6px solid transparent;background-image:linear-gradient(var(--bg2),var(--bg2)),linear-gradient(135deg,#c0945a 0%,#8b5a2a 25%,#e8c070 50%,#8b5a2a 75%,#c0945a 100%);background-origin:border-box;background-clip:padding-box,border-box;box-shadow:inset 0 0 18px rgba(0,0,0,.45),0 6px 28px rgba(0,0,0,.4);width:auto;max-width:100%;max-height:280px;object-fit:contain;cursor:zoom-in}
@media(prefers-reduced-motion:reduce){.rv-detail{animation:none}.syncing{animation:none;opacity:.7}.rv,*{transition-duration:.01ms!important}}
@media(max-width:700px){
  .rv{height:auto;min-height:100svh;overflow-y:auto;overflow-x:hidden}
  .rv header{position:sticky;top:0;z-index:50}
  .rv main{flex:none;height:auto;overflow:visible;display:block}
  .rv-mob-scroll{height:auto!important;overflow:visible!important;flex:none!important;min-height:0!important}
  .rv-detail{position:relative!important;top:auto!important;left:auto!important;right:auto!important;bottom:auto!important;z-index:auto!important}
}</style>
</head>

function _lum(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const toL=c=>c<=.03928?c/12.92:Math.pow((c+.055)/1.055,2.4);return .2126*toL(r)+.7152*toL(g)+.0722*toL(b);}
function _contrast(hex1,hex2){const l1=_lum(hex1),l2=_lum(hex2);return(Math.max(l1,l2)+.05)/(Math.min(l1,l2)+.05);}
// Retorna el color de text (#1a1008 o #f0ebe0) amb millor contrast contra bg
function textOnBg(bgHex){return _contrast("#f0ebe0",bgHex)>_contrast("#1a1008",bgHex)?"#f0ebe0":"#1a1008";}
// Alpha per al degradat segons el tema actiu
// Gradient bicolor per al panell de detall: c1 esquerra, c2 dreta (colors de mana del gremi)
function guildManaGradient(g){
  const mc=GUILD_MANA[g]||["C","C"];
  const c1=MANA_HEX[mc[0]]||"#C6C5C5",c2=MANA_HEX[mc[1]||mc[0]]||c1;
  return`linear-gradient(to bottom,${c1}55 0%,transparent 100%) left/50% 100% no-repeat,linear-gradient(to bottom,${c2}55 0%,transparent 100%) right/50% 100% no-repeat`;
}

function prefetchImg(src){if(!src||_prefetchCache.has(src))return;_prefetchCache.add(src);const i=new Image();i.src=src;}
function pillAlpha(){return(localStorage.getItem("rv-theme")||"light")==="dark"?"40":"60";}
// Retorna {background, color} per a una pill de gremi
function guildPillStyle(g,alpha){if(alpha===undefined)alpha=pillAlpha();
  const mc=GUILD_MANA[g]||["C"];
  const c1=MANA_HEX[mc[0]]||"#C6C5C5",c2=mc[1]?MANA_HEX[mc[1]]:c1;
  const grad=`linear-gradient(to right,${c1}${alpha},transparent 50%,${c2}${alpha})`;
  // Gradient border: padding-box mostra el farciment, border-box mostra la vora amb el mateix degradat

}

// Retorna el gremi d'un personatge pel seu objecte char
function charGuildFromCh(ch){const tags=(ch?.tags||[]).filter(t=>t!=="Dimir").sort();return tags[0]||"Guildless";}
// Retorna el gremi d'un personatge per nom (legacy)
function charGuild(name,cs){
  if(!name||name==="Compartido"||name==="Solo DM")return"Guildless";
  const ch=(cs||[]).find(c=>c.nom===name);
  return charGuildFromCh(ch);
}
// Resol propietari (ID o nom legacy o especial) → {ch, nom, guild, special}
function resolvePropietari(val,cs){
  if(!val||val==="Compartido"||val==="Solo DM")return{special:val||"Solo DM",nom:val||"Solo DM",guild:"Guildless"};
  const byId=(cs||[]).find(c=>c.id===val);
  if(byId)return{ch:byId,nom:byId.nom,guild:charGuildFromCh(byId),id:byId.id};
  const byNom=(cs||[]).find(c=>c.nom===val);
  if(byNom)return{ch:byNom,nom:byNom.nom,guild:charGuildFromCh(byNom),id:byNom.id};
  return{special:"Solo DM",nom:"Solo DM",guild:"Guildless",invalid:true};
}

function pjChars(cs){return(cs||[]).filter(c=>c.controlledby&&c.controlledby!=="DM");}
function guildLabel(g){
  const mc=GUILD_MANA[g]||["C"];
  const s1=MANA_SYM[mc[0]]||"◇",s2=mc[1]?MANA_SYM[mc[1]]:null;
  return{pre:s1,name:g,post:s2};
}

function renderMd(md){
  if(!md)return"";
  const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const inline=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\*(.+?)\*/g,"<em>$1</em>").replace(/`(.+?)`/g,"<code style='background:var(--bg3);padding:1px 5px;border-radius:3px;font-size:15px;color:var(--text)'>$1</code>").replace(/\[(.+?)\]\((.+?)\)/g,"<a href='$2' target='_blank' rel='noopener noreferrer' style='color:var(--gold)'>$1</a>");
  const isSepRow=l=>l.trim().replace(/\|/g,"").replace(/[\s\-:]/g,"").length===0;
  const parseCells=l=>l.trim().replace(/^\||\|$/g,"").split("|").map(c=>c.trim());
  const lines=md.split("\n");
  let html="",inUl=false,inP=false,tBuf=[];
  const closeP=()=>{if(inP){html+="</p>";inP=false;}};
  const closeUl=()=>{if(inUl){html+="</ul>";inUl=false;}};
  const flushTable=()=>{
    if(!tBuf.length)return;
    const rows=tBuf.filter(l=>!isSepRow(l));
    if(!rows.length){tBuf=[];return;}
    let t=`<div style="overflow-x:auto;margin:12px 0"><table style="border-collapse:collapse;width:100%;font-size:16px;font-family:'IM Fell English',serif">`;
    rows.forEach((l,i)=>{
      const cells=parseCells(l);
      if(i===0){t+=`<thead><tr>`+cells.map(c=>`<th style="text-align:left;padding:6px 10px;border-bottom:2px solid var(--border);color:var(--text);font-family:'Metamorphous',serif;font-size:13px;letter-spacing:.06em;white-space:nowrap;background:var(--bg3)">${inline(c)}</th>`).join("")+`</tr></thead><tbody>`;}
      else{t+=`<tr style="border-bottom:1px solid var(--border2)">`+cells.map(c=>`<td style="padding:5px 10px;color:var(--text);vertical-align:top">${inline(c)}</td>`).join("")+`</tr>`;}
    });
    t+=`</tbody></table></div>`;
    html+=t;tBuf=[];
  };
  for(const l of lines){
    if(/^\s*\|/.test(l)){closeP();closeUl();tBuf.push(l);continue;}
    else flushTable();
    const h1=/^# (.+)/.exec(l),h2=/^## (.+)/.exec(l),h3=/^### (.+)/.exec(l),li=/^[-*] (.+)/.exec(l),bq=/^> ?(.*)/.exec(l),hr=/^---+$/.test(l);
    if(h1){closeP();closeUl();html+=`<h1 style="font-family:'Metamorphous',serif;font-size:24px;color:var(--text);letter-spacing:.06em;margin:0 0 16px;border-bottom:2px solid var(--border);padding-bottom:8px">${inline(h1[1])}</h1>`;}
    else if(h2){closeP();closeUl();html+=`<h2 style="font-family:'Metamorphous',serif;font-size:20px;color:var(--text);letter-spacing:.06em;margin:20px 0 8px">${inline(h2[1])}</h2>`;}
    else if(h3){closeP();closeUl();html+=`<h3 style="font-family:'Metamorphous',serif;font-size:15px;color:var(--text2);letter-spacing:.08em;margin:14px 0 6px;text-transform:uppercase">${inline(h3[1])}</h3>`;}
    else if(hr){closeP();closeUl();html+="<hr style='border:none;border-top:1px solid var(--border);margin:16px 0'>";}
    else if(bq){closeP();closeUl();html+=`<blockquote style="border-left:3px solid var(--gold);margin:12px 0;padding:8px 16px;background:var(--bg3);color:var(--text2);font-style:italic">${inline(bq[1])}</blockquote>`;}
    else if(li){closeP();if(!inUl){html+="<ul style='margin:8px 0;padding-left:20px;list-style:none'>";inUl=true;}html+=`<li style="margin:4px 0;padding-left:8px">· ${inline(li[1])}</li>`;}
    else if(!l.trim()){closeUl();closeP();}
    else{closeUl();if(!inP){html+=`<p style="margin:0 0 10px">`;inP=true;}else html+=" ";html+=inline(l);}
  }
  flushTable();closeUl();closeP();
  return html;
}

function AventinPanel(){
  const slides=IMG_INDEX.aventino||[];
  const [idx,setIdx]=useState(0);
  useEffect(()=>{if(slides.length>0)setIdx(slides.length-1);},[slides.length]);
  const cur=slides[idx]||null;
  const prev=()=>setIdx(i=>Math.max(0,i-1));
  const next=()=>setIdx(i=>Math.min(slides.length-1,i+1));

  const touchX=useRef(null);
  const onTouchStart=e=>{ touchX.current=e.touches[0].clientX; };
  const onTouchEnd=e=>{
    if(touchX.current===null)return;
    const dx=e.changedTouches[0].clientX-touchX.current;
    if(Math.abs(dx)>40){dx<0?next():prev();}
    touchX.current=null;
  };

  const [hovL,setHovL]=useState(false);
  const [hovR,setHovR]=useState(false);

  const label=cur?`Acto ${cur.acto} — Sesión ${cur.sessio}`:"";
  const btnBase={position:"absolute",top:"50%",transform:"translateY(-50%)",border:"1px solid "+GOLD+"55",borderRadius:3,color:GOLD,fontSize:32,lineHeight:1,width:44,height:64,cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",zIndex:2,transition:"background .15s"};

  return(<div style={{display:"flex",flex:1,flexDirection:"column",alignItems:"center",justifyContent:"flex-start",background:BG,overflow:"auto",userSelect:"none",padding:"8px 6px 8px",boxSizing:"border-box"}}>
    {slides.length===0
      ?<p style={{color:"var(--text2)",fontFamily:"'IM Fell English',serif",fontSize:18,marginTop:40}}>No hay ediciones disponibles.</p>
      :<div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,width:"100%",maxWidth:960}}>
        <div style={{position:"relative",width:"100%"}} onTouchStart={onTouchStart} onTouchEnd={onTouchEnd}>
          {idx>0&&<button onClick={prev} aria-label="Anterior"
            onMouseEnter={()=>setHovL(true)} onMouseLeave={()=>setHovL(false)}
            style={{...btnBase,left:0,background:hovL?"#000a":"#0003"}}>‹</button>}
          <div style={{position:"absolute",top:8,left:"50%",transform:"translateX(-50%)",zIndex:3,display:"inline-flex",alignItems:"center",gap:2,background:"#000000cc",borderRadius:20,padding:"2px 6px",fontFamily:"'Metamorphous',serif",fontSize:13,color:"#e8dcc8",letterSpacing:".06em",whiteSpace:"nowrap"}}>
            <button onClick={prev} disabled={idx===0} aria-label="Anterior" style={{visibility:idx>0?"visible":"hidden",background:"none",border:"none",color:"#e8dcc8",fontSize:16,cursor:"pointer",padding:"0 4px",lineHeight:1}}>‹</button>
            <span>{label}</span>
            <button onClick={next} disabled={idx===slides.length-1} aria-label="Següent" style={{visibility:idx<slides.length-1?"visible":"hidden",background:"none",border:"none",color:"#e8dcc8",fontSize:16,cursor:"pointer",padding:"0 4px",lineHeight:1}}>›</button>
          </div>
          <img src={cur.path} alt={label} style={{width:"100%",display:"block",borderRadius:4,boxShadow:"0 4px 28px #0008",touchAction:"pinch-zoom"}}/>
          {idx<slides.length-1&&<button onClick={next} aria-label="Següent"
            onMouseEnter={()=>setHovR(true)} onMouseLeave={()=>setHovR(false)}
            style={{...btnBase,right:0,background:hovR?"#000a":"#0003"}}>›</button>}
        </div>
      </div>
    }
  </div>);
}

function MapPin({pin,editMode,onEdit,onDelete,onDragEnd,containerRef,onNavigate}){

  const didDrag=useRef(false);
  const c=GC[pin.gremi]||GOLD;

  const c1=MANA_HEX[mc[0]]||"#C6C5C5",c2=MANA_HEX[mc[1]||mc[0]]||c1;
  const pinBg=`linear-gradient(to right,${c1}cc,${c2}cc)`;
  const toPercent=(cx,cy)=>{const r=containerRef.current.getBoundingClientRect();return{x:parseFloat(Math.max(0,Math.min(100,(cx-r.left)/r.width*100)).toFixed(2)),y:parseFloat(Math.max(0,Math.min(100,(cy-r.top)/r.height*100)).toFixed(2))};};
  const handleMouseDown=(e)=>{
    if(!editMode)return;

    const sx=e.clientX,sy=e.clientY;didDrag.current=false;
    const onMove=ev=>{
      if(!didDrag.current&&(Math.abs(ev.clientX-sx)>6||Math.abs(ev.clientY-sy)>6))didDrag.current=true;
      if(didDrag.current&&containerRef.current)setDragPos(toPercent(ev.clientX,ev.clientY));

    const onUp=ev=>{
      document.removeEventListener("mousemove",onMove);document.removeEventListener("mouseup",onUp);
      if(didDrag.current){setDragPos(null);onDragEnd(pin.id,ev);}
    };
    document.addEventListener("mousemove",onMove);document.addEventListener("mouseup",onUp);
  };
  const handleClick=(e)=>{e.stopPropagation();if(didDrag.current){didDrag.current=false;return;}if(editMode){onEdit(pin);return;}if(pin.itemId&&onNavigate){onNavigate(pin.itemId);return;}setShowTip(s=>!s);};
  const px=dragPos?dragPos.x:pin.x,py=dragPos?dragPos.y:pin.y;
  return(<div style={{position:"absolute",left:px+"%",top:py+"%",transform:"translate(-50%,-50%)",zIndex:dragPos?20:10,cursor:editMode?(dragPos?"grabbing":"grab"):"pointer"}} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>{setHov(false);if(!editMode)setShowTip(false);}} onClick={handleClick} onMouseDown={handleMouseDown}>

      <span style={{fontSize:hov||editMode?9:7,lineHeight:1,color:"#fff",textShadow:"0 1px 2px #000a",userSelect:"none"}}>{lbl.pre}</span>
      {lbl.post&&<span style={{fontSize:hov||editMode?9:7,lineHeight:1,color:"#fff",textShadow:"0 1px 2px #000a",userSelect:"none"}}>{lbl.post}</span>}
      {editMode&&<button onClick={e=>{e.stopPropagation();onDelete(pin.id);}} style={{position:"absolute",top:-8,right:-8,background:"#c43030",border:"none",borderRadius:"50%",width:16,height:16,fontSize:10,color:"#fff",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",padding:0,lineHeight:1}}>×</button>}
    </div>
    {(hov||showTip)&&(()=>{const ps=guildPillStyle(pin.gremi||"Guildless");return(<div style={{position:"absolute",bottom:"calc(100% + 7px)",left:"50%",transform:"translateX(-50%)",background:ps.background,border:ps.border,borderRadius:6,padding:showTip?"8px 12px":"4px 10px",minWidth:showTip?140:0,maxWidth:220,boxShadow:"0 4px 16px #000a",zIndex:20,pointerEvents:"none",whiteSpace:showTip?"normal":"nowrap"}}>
      {pin.nom&&<div style={{fontFamily:"'Metamorphous',serif",fontSize:showTip?15:13,color:c,marginBottom:showTip&&pin.descripcio?4:0}}>{pin.nom}</div>}
      {showTip&&pin.descripcio&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:14,color:"var(--text)",lineHeight:1.4}}>{pin.descripcio}</div>}
      {!pin.nom&&!showTip&&pin.descripcio&&<div style={{fontFamily:"'IM Fell English',serif",fontSize:13,color:"var(--text)"}}>{pin.descripcio}</div>}
    </div>);})()}
  </div>);

function App({user,onUsersPanel}){

  const [hs,setHs]=useState(HANDOUTS);const [cs,setCs]=useState(CHARS);const [eds,setEds]=useState(EDIFICIS_DEFAULT);const [gds,setGds]=useState({});const [imgZoom,setImgZoom]=useState(false);
  const [saved,setSaved]=useState("");const [mob,setMob]=useState(false);
  const savedListScroll=useRef(0);
  const [gremioTarget,setGremioTarget]=useState(null);
  const [prevGremioState,setPrevGremioState]=useState(null);

  const effectiveUser=useMemo(()=>previewAs?{rol:"jugador",personatge:previewAs,email:"preview",uid:"preview"}:user,[previewAs,user]);
  const enterPreview=p=>{setPreviewAs(p);setShowPreviewSel(false);setSel(null);setShowD(false);setTab("mapa");setMapSubTab("aventino");};
  const navToChar=useCallback(id=>{
    setTab("chars");setQ("");setFilt("all");setSort("asc");setShowD(true);
    setPendingCharId(id);
  },[]);
  const navToEdifici=useCallback(id=>{
    setTab("mapa");setMapSubTab("aventino");setSel(null);setShowD(false);
    setAventNavTarget({id,key:Date.now()});
  },[]);
  const saveTimer=useRef(null);
  const startListDrag=useCallback(e=>{
    if(mob)return;e.preventDefault();
    const x0=e.clientX,w0=listW,tw=e.currentTarget.parentElement.getBoundingClientRect().width;
    const move=ev=>setListW(Math.max(15,Math.min(75,w0+(ev.clientX-x0)/tw*100)));
    const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);};
    document.addEventListener('mousemove',move);document.addEventListener('mouseup',up);
  },[listW,mob]);

  useEffect(()=>{const chk=()=>setMob(window.innerWidth<580);chk();window.addEventListener("resize",chk);return()=>window.removeEventListener("resize",chk);},[]);
  useEffect(()=>{(async()=>{try{
    await loadImgIndex();
    const chars=await loadData("chars",CHARS);
    const hs=await loadData("handouts",HANDOUTS);
    let eds=await loadData("edificis",EDIFICIS_DEFAULT);
    // migrar personajes de noms a IDs (idempotent)
    const idSet=new Set(chars.map(c=>c.id));
    const nameToId={};chars.forEach(c=>{nameToId[c.nom]=c.id;});
    let edsMigrated=false;
    eds=eds.map(e=>{
      const parts=parsePers(e.personajes);
      if(!parts.length)return e;
      const migrated=parts.map(p=>idSet.has(p)?p:(nameToId[p]||p));
      const newStr=migrated.join(", ");
      if(newStr!==e.personajes){edsMigrated=true;return{...e,personajes:newStr};}
      return e;
    });
    setCs(chars);setHs(hs);setEds(eds);
    if(edsMigrated)await saveData("edificis",eds);
    setGds(await loadData("gremios",{}));
  }catch(e){console.error(e);}})();},[]);

  const saveKey=useCallback((key,data)=>{
    if(IS_DEV_ENV){setSaved("⚗ sessió");setTimeout(()=>setSaved(""),2000);return;}
    setSaved("⏳");clearTimeout(saveTimer.current);
    saveTimer.current=setTimeout(async()=>{try{await saveData(key,data);}catch(e){console.error(e);}setSaved("✦ Guardado");setTimeout(()=>setSaved(""),2500);},600);
  },[]);

  const updH=(i,f,v)=>{const h=hs.map((x,j)=>j===i?{...x,[f]:v}:x);setHs(h);saveKey("handouts",h);};
  const updC=(i,f,v)=>{const c=cs.map((x,j)=>j===i?{...x,[f]:v}:x);setCs(c);saveKey("chars",c);};
  const updE=(i,f,v)=>{let e;if(f==="__del__"){e=eds.filter((_,j)=>j!==i);}else{e=eds.map((x,j)=>j===i?{...x,[f]:v}:x);}setEds(e);saveKey("edificis",e);};
  const updG=(gremi,field,val)=>{const nd={...gds,[gremi]:{...(gds[gremi]||{}),[field]:val}};setGds(nd);saveKey("gremios",nd);};

  const newH=()=>{const h=[...hs,{nom:"Nuevo objeto",propietari:"Compartido",visible:"Tots",contingut:"",notes_dm:"",img:"",id:genId()}];setHs(h);saveKey("handouts",h);setTab("handouts");setQ("");setFilt("all");setSort("asc");setSel(h.length-1);setShowD(true);};
  const newC=()=>{const c=[...cs,{nom:"Nuevo personaje",bio:"",info:"",tags:["Guildless"],controlledby:"DM",visible:"Tots",avatar:"",id:genId()}];setCs(c);saveKey("chars",c);setTab("chars");setQ("");setFilt("all");setSort("asc");setSel(c.length-1);setShowD(true);};
  const newE=()=>{const e=[...eds,{nom:"Nuevo edificio",gremi:"Guildless",personajes:"",reglas:"",conflicto:"",ideas:"",activo:true,id:genId()}];setEds(e);saveKey("edificis",e);setSel(e.length-1);setShowD(true);};

  const items=tab==="handouts"?hs:cs;
  const getOI=useCallback(fi=>tab==="handouts"?hs.findIndex(x=>x.id===fi.id):cs.findIndex(x=>x.id===fi.id),[hs,cs,tab]);
  const cycleSort=()=>setSort(s=>s==="asc"?"desc":"asc");

  const canSeeDimir=useMemo(()=>effectiveUser.rol==="dm"||(cs.find(c=>c.nom===effectiveUser.personatge)?.tags||[]).includes("Dimir"),[effectiveUser,cs]);
  const secureT=useCallback((tags,charNom)=>{
    if(effectiveUser.rol==="dm")return tags||[];
    if(charNom===effectiveUser.personatge)return tags||[];
    if(canSeeDimir&&!PJS.includes(charNom))return tags||[];
    const f=(tags||[]).filter(t=>t!=="Dimir");return f.length?f:["Guildless"];
  },[effectiveUser,canSeeDimir]);

  const fltd=useMemo(()=>{
    const lq=q.toLowerCase();
    let r=items.filter(x=>{const ms=!lq||x.nom.toLowerCase().includes(lq)||(x.contingut||"").toLowerCase().includes(lq)||(x.bio||"").toLowerCase().includes(lq)||(x.info||"").toLowerCase().includes(lq);const mf=tab==="chars"?filt==="all"||secureT(x.tags,x.nom).includes(filt):filt==="all"||x.propietari===filt;return ms&&mf;});
    if(sort==="asc")r=[...r].sort((a,b)=>a.nom.localeCompare(b.nom));
    else if(sort==="desc")r=[...r].sort((a,b)=>b.nom.localeCompare(a.nom));
    if(effectiveUser.rol==="jugador"){r=r.filter(x=>visibleToUser(x.visible,effectiveUser.personatge));if(tab==="handouts")r=r.filter(x=>x.propietari!=="Solo DM");}
    return r;
  },[items,q,filt,sort,tab,effectiveUser,secureT]);
  useEffect(()=>{
    if(!pendingCharId||tab!=="chars")return;
    const idx=fltd.findIndex(x=>x.id===pendingCharId);
    if(idx>=0){setSel(idx);setShowD(true);setPendingCharId(null);}
  },[pendingCharId,fltd,tab]);

  const item=sel!==null&&sel<fltd.length?fltd[sel]:null;
  const origI=item?getOI(item):-1;
  const ac=item?mc(item,tab,tab==="chars"?secureT(item.tags,item.nom):undefined):GOLD;
  const isPJ=item&&PJS.includes(item.nom);
  const imgBgCh=useMemo(()=>{
    if(!item)return"transparent";
    if(tab==="chars"){
      const vt=secureT(item.tags,item.nom);

        {TABS.filter(t=>!t.dm||effectiveUser.rol==="dm").map(t=><button key={t.id} role="tab" aria-selected={tab===t.id} onClick={()=>chTab(t.id)} onKeyDown={e=>{const ts=TABS.filter(x=>!x.dm||effectiveUser.rol==="dm");const i=ts.findIndex(x=>x.id===t.id);if(e.key==="ArrowRight")chTab(ts[(i+1)%ts.length].id);if(e.key==="ArrowLeft")chTab(ts[(i-1+ts.length)%ts.length].id);}} style={{background:tab===t.id?BG:"transparent",border:"1px solid "+(tab===t.id?GOLD+"55":"transparent"),borderBottom:tab===t.id?"1px solid "+BG:"none",borderRadius:"3px 3px 0 0",padding:"6px 14px",fontSize:mob?10:12,cursor:"pointer",color:tab===t.id?GOLD:"var(--text2)",fontFamily:"'Metamorphous',serif",letterSpacing:".07em",marginBottom:tab===t.id?-1:0,transition:"all .15s"}}>{t.icon} {mob?"":t.label.toUpperCase()}</button>)}
      </div>
      </div>
    </header>
    <main style={{display:"flex",flexDirection:"column",flex:1,overflow:"hidden"}}>
    {tab==="aventino"?<AventinPanel/>
    :tab==="mapa"?<MapaPanel edificis={eds} onUpdate={updE} onNew={newE} sel={sel} onSelect={setSel} isMob={mob} showD={showD} setShowD={setShowD} canSeeDimir={canSeeDimir} isPlayer={effectiveUser.rol==="jugador"} playerName={effectiveUser.personatge} chars={cs} navTarget={aventNavTarget} onNavToChar={navToChar} onNavToGremi={navToGremi} onNavToEdifici={navToEdifici} user={effectiveUser} subTab={mapSubTab} setSubTab={setMapSubTab}/>
    :tab==="gremios"?<GremiosPanel canSeeDimir={canSeeDimir} isMob={mob} initGremi={gremioTarget} onVolver={prevGremioState?volverDeGremi:null}/>
    :tab==="sesiones"?<SesionesPanel isMob={mob}/>
    :<div style={{display:"flex",flex:1,overflow:"hidden",position:"relative",background:BG}} className="rv-mob-scroll">
      <div style={{width:mob?"100%":item?`${listW}%`:"100%",display:mob&&showD&&item?"none":"flex",flexDirection:"column",transition:"width .0s"}}>
        <div style={{padding:"8px 10px",borderBottom:"1px solid "+BORDER,flexShrink:0,background:BG2}}>
          <div style={{position:"relative",marginBottom:7}}>
            <span style={{position:"absolute",left:9,top:"50%",transform:"translateY(-50%)",fontSize:17,color:GOLD,opacity:.5,pointerEvents:"none"}}>⚜</span>
            <input aria-label={"Cerca "+(tab==="handouts"?"objectes":"personatges")} type="text" placeholder={"Cerca "+(tab==="handouts"?"objectes":"personatges")+"..."} value={q} onChange={e=>{setQ(e.target.value);setSel(null);}} style={{width:"100%",padding:"7px 10px 7px 28px",borderRadius:3,border:"1px solid "+BORDER,background:BG,color:"var(--text)",WebkitTextFillColor:"var(--text)",fontFamily:"'IM Fell English',serif",fontSize:18,outline:"none"}}/>
          </div>
          <div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}}>
            <SortBtn sort={sort} onSort={cycleSort}/>
            {tab==="chars"?AG.filter(g=>(canSeeDimir||g!=="Dimir")&&cs.some(c=>(c.tags||[]).includes(g))).map(g=>{const psfc=guildPillStyle(g,pillAlpha());const lblfc=guildLabel(g);return<button key={g} className="rv-filter" onClick={()=>setFilt(g===filt?"all":g)} style={{background:filt===g?psfc.background:"transparent",border:filt===g?psfc.border:"1px solid "+(GC[g]||"#8a7a5a")+"22",color:"var(--text)"}}>{lblfc.pre} {g}{lblfc.post?" "+lblfc.post:""}</button>;})
            :[...PJS,"Compartido",...(effectiveUser.rol==="dm"?["Solo DM"]:[])] .map(p=><button key={p} className="rv-filter" onClick={()=>setFilt(p===filt?"all":p)} style={{background:filt===p?(PC[p]||"#888")+"1a":"transparent",border:"1px solid "+(filt===p?(PC[p]||"#888")+"66":(PC[p]||"#888")+"22"),color:filt===p?PC[p]||"#888":"#6a4a2a"}}>{p}</button>)}
          </div>
        </div>
        <div className="rv-mob-scroll" style={{overflowY:"auto",flex:1}}>
          {fltd.length===0&&<div style={{padding:30,color:"var(--text2)",fontSize:17,textAlign:"center",fontStyle:"italic",fontFamily:"'IM Fell English',serif"}}>Cap registre als arxius...</div>}
          {fltd.map((x,i)=>{const vt=tab==="chars"?secureT(x.tags,x.nom):undefined,c=mc(x,tab,vt),isSel=!mob&&sel===i,sig=tab==="chars"&&vt&&vt[0]?GS[vt[0]]:"📜";const cnx=tab==="chars"?(x.visible==="Tots"||!x.visible||x.visible===""?"Todos":x.visible==="Nadie"||x.visible==="Solo DM"?"Nadie":x.visible.split(",")[0].trim()+(x.visible.includes(",")?"…":"")):null;const xlocs=tab==="chars"?eds.filter(e=>parsePers(e.personajes).includes(x.id)&&(effectiveUser.rol==="dm"||e.activo)):[];
            return(<div key={i} role="button" tabIndex={0} aria-pressed={isSel} onClick={()=>pick(i)} onKeyDown={e=>(e.key==="Enter"||e.key===" ")&&pick(i)} onMouseEnter={()=>prefetchImg(IMG_INDEX[tab==="handouts"?"handouts":"chars"][x.id])} className="rv-row" style={{padding:"9px 14px",cursor:"pointer",borderBottom:"1px solid "+BORDER,background:isSel?BG3:"transparent",borderLeft:isSel?"2px solid "+c:"2px solid transparent",display:"flex",alignItems:"center",gap:10,transition:"background .1s"}}>
              <Avatar nom={x.nom} id={x.id} size={34} color={c} tab={tab}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:18,color:isSel?"var(--text)":"var(--text2)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",fontFamily:"'Metamorphous',serif",letterSpacing:".03em",fontWeight:isSel?700:500}}>{x.nom}{PJS.includes(x.nom)&&<span style={{marginLeft:5,fontSize:12,background:c+"1a",color:c,borderRadius:2,padding:"1px 4px",fontFamily:"'Metamorphous',serif",verticalAlign:"middle"}}>PJ</span>}</div>
                <div style={{display:"flex",flexDirection:"column",gap:3,marginTop:3}}>
                  <div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}}>
                    {tab==="chars"?secureT(x.tags,x.nom).map(t=>{const pst=guildPillStyle(t);const lblt=guildLabel(t);return<span key={t} style={{fontSize:16,padding:"1px 7px",borderRadius:8,background:pst.background,border:pst.border,color:pst.textColor,fontFamily:"'Metamorphous',serif",letterSpacing:".03em"}}>{lblt.pre} {t}{lblt.post?" "+lblt.post:""}</span>;}):x.propietari&&(()=>{
  const rp=resolvePropietari(x.propietari,cs);const psh=guildPillStyle(rp.guild);const lblh=guildLabel(rp.guild);
  return<span style={{fontSize:16,padding:"1px 7px",borderRadius:8,background:psh.background,border:psh.border,color:psh.textColor,fontFamily:"'Metamorphous',serif",letterSpacing:".03em"}}>{lblh.pre} {rp.nom}{lblh.post?" "+lblh.post:""}</span>;
})()}
                    {cnx&&effectiveUser.rol==="dm"&&<span style={{fontSize:13,padding:"1px 5px",borderRadius:6,background:BG3,color:"var(--text2)",fontFamily:"'IM Fell English',serif",fontStyle:"italic"}}>👁 {cnx}</span>}
                  </div>
                  {xlocs.length>0&&<div style={{display:"flex",gap:3,flexWrap:"wrap",alignItems:"center"}}>
                    {xlocs.map(e=>{const sg=(canSeeDimir||e.gremi!=="Dimir")?e.gremi:"Guildless";const psx=guildPillStyle(sg);const lblx=guildLabel(sg);return<span key={e.id} style={{fontSize:13,padding:"1px 5px",borderRadius:6,background:psx.background,border:psx.border,color:psx.textColor,fontFamily:"'Metamorphous',serif",letterSpacing:".02em"}}>{lblx.pre} {e.nom}{lblx.post?" "+lblx.post:""}</span>;})}
                  </div>}
                </div>
              </div>
              <span style={{color:isSel?c:BORDER,fontSize:18,flexShrink:0}}>›</span>
            </div>);
          })}
        </div>
        <div style={{padding:"8px 10px",borderTop:"1px solid "+BORDER,background:BG2,flexShrink:0}}>
          <button onClick={tab==="handouts"?newH:newC} style={{width:"100%",padding:"6px",fontSize:17,border:"1px dashed "+GOLD+"44",borderRadius:3,background:"transparent",color:"var(--text2)",cursor:"pointer",fontFamily:"'Metamorphous',serif",letterSpacing:".08em"}}>+ NOU {tab==="handouts"?"OBJECTE":"PERSONATGE"}</button>
        </div>
      </div>
      {item&&!mob&&<div onMouseDown={startListDrag} style={{width:5,flexShrink:0,cursor:'col-resize',background:BORDER,zIndex:2,transition:'background .15s'}} onMouseEnter={e=>e.currentTarget.style.background=GOLD+'66'} onMouseLeave={e=>e.currentTarget.style.background=BORDER}/>}
      {item&&(mob?showD?Detail:null:<div style={{flex:1,overflow:"hidden",position:"relative",display:"flex"}}>{Detail}</div>)}
    </div>}
    </main>
  </div>);
}

function Root(){
  const [ready,setReady]=useState(false);
  const [user,setUser]=useState(null);
  const [showUsers,setShowUsers]=useState(false);

  useEffect(()=>{
    initFirebase(FB_CONFIG).then(ok=>{
      if(!ok){setReady(true);return;}
      const unsub=auth.onAuthStateChanged(async fbUser=>{
        if(fbUser){
          const profile=await ensureUserProfile(fbUser.uid,fbUser.email);
          setUser({uid:fbUser.uid,email:fbUser.email,...profile});
        }else{
          setUser(null);
        }
        setReady(true);
      });
      return unsub;
    });
  },[]);

  const Loading=<div style={{height:"100vh",background:BG,display:"flex",alignItems:"center",justifyContent:"center",flexDirection:"column",gap:12}}><div style={{fontSize:28}}>⚜</div><div style={{fontFamily:"'Metamorphous',serif",color:GOLD,fontSize:18,letterSpacing:".08em"}} className="syncing">Cargando...</div></div>;
  if(!ready)return Loading;
  if(!user)return <LoginScreen/>;
  if(!user.rol)return <PendingScreen email={user.email}/>;
  const envPath=window.location.pathname;
  const isPreviewEnv=/\/(pre|dev)(\/|$)/.test(envPath);
  if(isPreviewEnv&&user.rol!=="dm")return(
    <div style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",height:"100vh",gap:16,fontFamily:"'Metamorphous',serif",color:"var(--text)",background:"var(--bg-body)"}}>
      <div style={{fontSize:48}}>🔒</div>
      <div style={{fontSize:22,letterSpacing:".08em"}}>Accés restringit</div>
      <div style={{fontSize:16,color:"var(--text2)"}}>Aquest entorn és només per al DM.</div>
      <button onClick={()=>auth.signOut()} style={{marginTop:8,padding:"8px 20px",fontSize:16,fontFamily:"'Metamorphous',serif",background:"transparent",border:"1px solid var(--border)",borderRadius:4,color:"var(--text2)",cursor:"pointer"}}>Tancar sessió</button>
    </div>
  );
  return(<>
    {showUsers&&<UserMgmt onClose={()=>setShowUsers(false)}/>}
    <App user={user} onUsersPanel={user.rol==="dm"?()=>setShowUsers(true):null}/>
  </>);
}
ReactDOM.render(<Root/>,document.getElementById('root'));
</script>
</body>
</html>
